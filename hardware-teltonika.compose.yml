# Optional second source; run alongside the existing Nuqati API on Coolify.
# IMPORTANT: put this on a Docker network that can reach the same Postgres service.
services:
  teltonika:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.teltonika_receiver"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set to the same PostgreSQL URL as Nuqati API}
      TELTONIKA_PORT: "5027"
      TELTONIKA_BIND_HOST: ${TELTONIKA_BIND_HOST:-127.0.0.1}
      TELTONIKA_ALLOWED_CIDRS: ${TELTONIKA_ALLOWED_CIDRS:-}
      TELTONIKA_MAX_DB_CONCURRENCY: ${TELTONIKA_MAX_DB_CONCURRENCY:-16}
    ports:
      - "${TELTONIKA_BIND_HOST:-127.0.0.1}:5027:5027/tcp"
