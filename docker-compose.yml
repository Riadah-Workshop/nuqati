# Local development only: PostgreSQL is required by the existing API DDL.
# Override these test-only credentials in a local .env for shared environments.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nuqati_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nuqati_dev_only_password}
      POSTGRES_DB: ${POSTGRES_DB:-nuqati_dev}
    volumes:
      - nuqati_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-nuqati_dev}:${POSTGRES_PASSWORD:-nuqati_dev_only_password}@db:5432/${POSTGRES_DB:-nuqati_dev}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      NUQATI_AUTH_SECRET: ${NUQATI_AUTH_SECRET:-nuqati-local-development-only-rotate-for-production}
      NUQATI_TRUSTED_PROXIES: 127.0.0.1/8,::1/128
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  nuqati_dev_pgdata:
