services:
  web:
    build:
      context: ./web
    environment:
      STAGING_USER: ${STAGING_USER:?Set staging username in Coolify}
      STAGING_PASSWORD_HASH: ${STAGING_PASSWORD_HASH:?Set Caddy bcrypt hash in Coolify}
    depends_on:
      - api
    restart: unless-stopped
    expose:
      - "80"
  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:?Set DB user}:${POSTGRES_PASSWORD:?Set DB password}@db:5432/${POSTGRES_DB:?Set DB name}
      CORS_ORIGINS: ${STAGING_ORIGIN:?Set HTTPS staging origin}
      NUQATI_AUTH_SECRET: ${NUQATI_AUTH_SECRET:?Set a random secret of at least 32 characters}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8000"
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set DB user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set DB password}
      POSTGRES_DB: ${POSTGRES_DB:?Set DB name}
    volumes:
      - nuqati_staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  nuqati_staging_pgdata:
