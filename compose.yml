# Docker keeps every container's output in a log file that grows without limit by default.
# These settings cap each container at 5 files of 10 MB so logs can never fill the server disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  web:
    build:
      context: ./web
      args:
        VITE_MAPTILER_API_KEY: ${VITE_MAPTILER_API_KEY:?Set MapTiler API key in Coolify}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "80"
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:?Set DB user}:${POSTGRES_PASSWORD:?Set DB password}@db:5432/${POSTGRES_DB:?Set DB name}
      CORS_ORIGINS: ${NUQATI_PUBLIC_ORIGIN:?Set HTTPS production origin}
      NUQATI_AUTH_SECRET: ${NUQATI_AUTH_SECRET:?Set a random secret of at least 32 characters}
      NUQATI_AUTH_SECRET_PREVIOUS: ${NUQATI_AUTH_SECRET_PREVIOUS:-}
      NUQATI_TRUSTED_PROXIES: ${NUQATI_TRUSTED_PROXIES:-127.0.0.1/8,::1/128}
      NUQATI_PUBLIC_ORIGIN: ${NUQATI_PUBLIC_ORIGIN:?Set HTTPS production origin}
      NUQATI_EMAIL_FROM: ${NUQATI_EMAIL_FROM:-noreply@al-riadah.sa}
      NUQATI_WHATSAPP_VERIFY_TOKEN: ${NUQATI_WHATSAPP_VERIFY_TOKEN:-}
      NUQATI_WHATSAPP_APP_SECRET: ${NUQATI_WHATSAPP_APP_SECRET:-}
      NUQATI_SMTP_HOST: ${NUQATI_SMTP_HOST:-}
      NUQATI_SMTP_PORT: ${NUQATI_SMTP_PORT:-587}
      NUQATI_SMTP_USER: ${NUQATI_SMTP_USER:-}
      NUQATI_SMTP_PASSWORD: ${NUQATI_SMTP_PASSWORD:-}
      NUQATI_RUN_MIGRATIONS: ${NUQATI_RUN_MIGRATIONS:-1}
      NUQATI_RATE_LIMIT_INGEST: ${NUQATI_RATE_LIMIT_INGEST:-log}
      NUQATI_RATE_LIMIT_REPORTS: ${NUQATI_RATE_LIMIT_REPORTS:-enforce}
      NUQATI_DB_POOL_SIZE: ${NUQATI_DB_POOL_SIZE:-}
      NUQATI_DB_MAX_OVERFLOW: ${NUQATI_DB_MAX_OVERFLOW:-}
      NUQATI_DB_REQUEST_SLOTS: ${NUQATI_DB_REQUEST_SLOTS:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    expose:
      - "8000"
  # Hardware GPS TCP receiver — separate from the HTTP API
  teltonika:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.teltonika_receiver"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:?Set DB user}:${POSTGRES_PASSWORD:?Set DB password}@db:5432/${POSTGRES_DB:?Set DB name}
      TELTONIKA_PORT: "5027"
      TELTONIKA_BIND_HOST: ${TELTONIKA_BIND_HOST:-127.0.0.1}
      TELTONIKA_ALLOWED_CIDRS: ${TELTONIKA_ALLOWED_CIDRS:-}
      TELTONIKA_MAX_DB_CONCURRENCY: ${TELTONIKA_MAX_DB_CONCURRENCY:-16}
      NUQATI_WORKER_WATCHDOG_SECONDS: ${NUQATI_WORKER_WATCHDOG_SECONDS:-0}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    # Healthy while the receiver's event loop still writes its heartbeat (every 15 s; limit 90 s).
    healthcheck:
      test: ["CMD", "python", "-m", "app.heartbeat", "teltonika", "90"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "${TELTONIKA_BIND_HOST:-127.0.0.1}:5027:5027/tcp"
  # Scheduled email reports: private worker, no publicly exposed ports.
  report_scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.report_subscriptions"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:?Set DB user}:${POSTGRES_PASSWORD:?Set DB password}@db:5432/${POSTGRES_DB:?Set DB name}
      NUQATI_EMAIL_FROM: ${NUQATI_EMAIL_FROM:-noreply@al-riadah.sa}
      NUQATI_SMTP_HOST: ${NUQATI_SMTP_HOST:-}
      NUQATI_SMTP_PORT: ${NUQATI_SMTP_PORT:-587}
      NUQATI_SMTP_USER: ${NUQATI_SMTP_USER:-}
      NUQATI_SMTP_PASSWORD: ${NUQATI_SMTP_PASSWORD:-}
      NUQATI_WORKER_WATCHDOG_SECONDS: ${NUQATI_WORKER_WATCHDOG_SECONDS:-0}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    # Healthy while the scheduler loop still runs (one beat per cycle of about 30 s; limit 15 minutes).
    healthcheck:
      test: ["CMD", "python", "-m", "app.heartbeat", "report_scheduler", "900"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set DB user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set DB password}
      POSTGRES_DB: ${POSTGRES_DB:?Set DB name}
    volumes:
      - nuqati_staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging
  # Daily PostgreSQL dump into the nuqati_backups volume (same host as the database).
  # This protects against mistakes and corruption. It does NOT protect against losing the server:
  # keep an encrypted copy elsewhere (docs/compliance/BACKUP_RESTORE.md). Restore drill:
  #   docker exec <db_backup container> /usr/local/bin/restore_drill.sh
  db_backup:
    build:
      context: ./ops/backup
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?Set DB user}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set DB password}
      PGDATABASE: ${POSTGRES_DB:?Set DB name}
      NUQATI_BACKUP_HOUR_UTC: ${NUQATI_BACKUP_HOUR_UTC:-23}
      NUQATI_BACKUP_KEEP_DAYS: ${NUQATI_BACKUP_KEEP_DAYS:-14}
      # Off-server encrypted copy (docs/compliance/BACKUP_RESTORE.md 2b). Empty = switched off; nothing leaves the server.
      NUQATI_OFFSITE: ${NUQATI_OFFSITE:-}
      NUQATI_OFFSITE_PATH: ${NUQATI_OFFSITE_PATH:-}
      NUQATI_OFFSITE_PASSWORD: ${NUQATI_OFFSITE_PASSWORD:-}
      NUQATI_OFFSITE_PASSWORD2: ${NUQATI_OFFSITE_PASSWORD2:-}
      NUQATI_OFFSITE_KEEP_DAYS: ${NUQATI_OFFSITE_KEEP_DAYS:-}
      NUQATI_OFFSITE_MIN_KEEP: ${NUQATI_OFFSITE_MIN_KEEP:-}
      NUQATI_OFFSITE_MAX_AGE_HOURS: ${NUQATI_OFFSITE_MAX_AGE_HOURS:-}
      NUQATI_OFFSITE_DRIVE_SERVICE_ACCOUNT_JSON: ${NUQATI_OFFSITE_DRIVE_SERVICE_ACCOUNT_JSON:-}
      NUQATI_OFFSITE_DRIVE_SHARED_DRIVE_ID: ${NUQATI_OFFSITE_DRIVE_SHARED_DRIVE_ID:-}
      NUQATI_OFFSITE_DRIVE_CLIENT_ID: ${NUQATI_OFFSITE_DRIVE_CLIENT_ID:-}
      NUQATI_OFFSITE_DRIVE_CLIENT_SECRET: ${NUQATI_OFFSITE_DRIVE_CLIENT_SECRET:-}
      NUQATI_OFFSITE_DRIVE_TOKEN: ${NUQATI_OFFSITE_DRIVE_TOKEN:-}
    volumes:
      - nuqati_backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "/usr/local/bin/backup.sh", "health"]
      interval: 10m
      timeout: 10s
      retries: 1
      start_period: 15m
volumes:
  nuqati_backups:
    # Daily dumps written by the db_backup service. Deleting this volume deletes the on-host backups.
  nuqati_staging_pgdata:
    # Reuses your original staging volume by default, but creates it on new hosts.
    # Override NUQATI_PG_VOLUME_NAME with the exact backed-up production volume.
    name: ${NUQATI_PG_VOLUME_NAME:-hskj899cs3voe1lk5gkyyxb8_nuqati-staging-pgdata}
