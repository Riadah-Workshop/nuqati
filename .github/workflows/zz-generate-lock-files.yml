name: Generate lock files (temporary, removed in the next commit)

# One-off helper for the pull request that introduces the lock files: the sandbox that prepares changes has no
# network access, so the lock files are produced here and pushed back to the pull request branch. It never runs
# for pull requests from forks and is deleted before the pull request is merged.

on:
  pull_request:
    paths:
      - ".github/workflows/zz-generate-lock-files.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # same minor version as backend/Dockerfile

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # same major version as web/Dockerfile

      - name: Backend lock (hashes for every file, resolved for Python 3.12 on Linux)
        working-directory: backend
        run: |
          python -m pip install pip-tools
          pip-compile requirements.in --output-file requirements.txt --generate-hashes --strip-extras --no-emit-index-url --resolver=backtracking
          grep -c '^[a-zA-Z0-9_.-]*==' requirements.txt

      - name: Web lock (no scripts are run)
        working-directory: web
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const l=require('./package-lock.json');console.log('lockfileVersion',l.lockfileVersion,'packages',Object.keys(l.packages).length)"

      - name: Commit both files to the pull request branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/requirements.txt web/package-lock.json
          git commit -m "Generate lock files (backend requirements.txt with hashes, web package-lock.json)"
          git push
