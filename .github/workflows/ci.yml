name: CI

# Safety net for every pull request and for main. Nothing here deploys or publishes anything.
# Release builds (APK/AAB) stay in the build-*.yml workflows.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI-only values. They protect nothing and are never used outside this job.
      NUQATI_AUTH_SECRET: ci-only-secret-at-least-32-characters-long-0000
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nuqati_ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: nuqati_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nuqati_ci -d nuqati_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # same minor version as backend/Dockerfile
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-test.txt

      - name: Byte-compile the application
        run: python -m compileall -q backend/app

      # Contract tests read source files; unit tests need no server. Layout guards live here too.
      - name: Unit, contract and layout tests (SQLite, no server)
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite:////tmp/nuqati_ci_unit.db
        run: >-
          python -m pytest -q
          --ignore=backend/test_auth_runtime_postgres.py
          --ignore=backend/test_security_audit_postgres.py
          --ignore=backend/test_concept_reports.py
          backend

      # Uses package-relative imports, so it runs through unittest as documented in
      # docs/history/NUQATI_CONCEPT_REPORTS_20261124.md.
      - name: Report-suite tests (in-memory SQLite)
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite:////tmp/nuqati_ci_reports.db
        run: python -m unittest backend.test_concept_reports -v

      # The tests build their schema with `python -m app.migrate` and import app.main against a real
      # PostgreSQL server, so this also proves the API boots on a migrated database.
      - name: API integration tests (PostgreSQL)
        env:
          PYTHONPATH: backend
          NUQATI_TEST_DATABASE_URL: postgresql+psycopg2://nuqati_ci:ci-only-not-a-secret@localhost:5432/nuqati_test
        run: python -m pytest -q backend/test_auth_runtime_postgres.py backend/test_security_audit_postgres.py

  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # same major version as web/Dockerfile

      - name: Is a lockfile committed?
        id: lock
        run: echo "committed=$(test -f package-lock.json && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          if [ "${{ steps.lock.outputs.committed }}" = "true" ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      # `npm run build` is `tsc -b && vite build`: strict type-check, then bundle.
      - name: Type-check and build
        run: npm run build

      - name: Publish the generated lockfile
        if: steps.lock.outputs.committed == 'false'
        run: echo "::notice::web/package-lock.json is not committed. Download the 'web-package-lock' artifact from this run and commit it, then CI and Docker will use 'npm ci'."

      - name: Upload the generated lockfile
        if: steps.lock.outputs.committed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: web-package-lock
          path: web/package-lock.json
          if-no-files-found: warn

  docker:
    name: Docker, compose and Caddy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        env:
          # Dummy values only to satisfy the `${VAR:?}` guards in compose.yml.
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: ci
          NUQATI_PUBLIC_ORIGIN: https://example.invalid
          NUQATI_AUTH_SECRET: ci-only-secret-at-least-32-characters-long-0000
          VITE_MAPTILER_API_KEY: ci-placeholder
          DATABASE_URL: postgresql+psycopg2://ci:ci-only@db:5432/ci
        run: |
          docker compose -f compose.yml config --quiet
          docker compose -f docker-compose.yml config --quiet
          docker compose -f hardware-teltonika.compose.yml config --quiet

      # Same context and Dockerfile as Coolify: this is what the activated .dockerignore must satisfy.
      - name: Build the API image
        run: docker build -f backend/Dockerfile -t nuqati-api:ci .

      - name: API image contains the app and its dependencies
        run: >-
          docker run --rm --entrypoint python nuqati-api:ci -c
          "import fastapi, sqlalchemy, psycopg2, openpyxl, reportlab, uvicorn, pathlib;
          files = sorted(p.name for p in pathlib.Path('/app/app').glob('*.py'));
          features = sorted(p.name for p in pathlib.Path('/app/app/features').glob('*.py'));
          print(files, features);
          assert 'main.py' in files and 'api_app.py' in files and 'models.py' in files and 'teltonika_receiver.py' in files;
          assert 'trips.py' in features and 'scoring.py' in features"

      # Syntax check only (adapt); it does not need the `api` host to resolve.
      - name: Caddyfile parses
        run: >-
          docker run --rm -v "$PWD/web/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine
          caddy adapt --config /etc/caddy/Caddyfile > /dev/null

  backup:
    name: Backup and restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build the backup image through compose (same definition Coolify uses)
        env:
          # Dummy values only to satisfy the `${VAR:?}` guards in compose.yml.
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: ci
          NUQATI_PUBLIC_ORIGIN: https://example.invalid
          NUQATI_AUTH_SECRET: ci-only-secret-at-least-32-characters-long-0000
          VITE_MAPTILER_API_KEY: ci-placeholder
        run: docker compose -f compose.yml build db_backup

      - name: Start a disposable PostgreSQL and create the application's schema with migrations
        run: |
          docker network create nq-ci
          docker run -d --name nq-db --network nq-ci -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci-only -e POSTGRES_DB=ci postgres:16-alpine
          # the official image starts a temporary server to initialise, stops it, then starts the real one:
          # wait for the second "ready" line, otherwise the next step can hit the shutdown
          for i in $(seq 1 60); do [ "$(docker logs nq-db 2>&1 | grep -c 'ready to accept connections')" -ge 2 ] && break; sleep 1; done
          docker exec nq-db pg_isready -U ci -d ci
          docker build -f backend/Dockerfile -t nuqati-api:ci .
          docker run --rm --network nq-ci \
            -e DATABASE_URL=postgresql+psycopg2://ci:ci-only@nq-db:5432/ci \
            -e NUQATI_AUTH_SECRET=ci-only-secret-at-least-32-characters-long-0000 \
            nuqati-api:ci python -m app.migrate
          docker run --rm --network nq-ci \
            -e DATABASE_URL=postgresql+psycopg2://ci:ci-only@nq-db:5432/ci \
            -e NUQATI_AUTH_SECRET=ci-only-secret-at-least-32-characters-long-0000 \
            nuqati-api:ci python -c "
          from app.db import SessionLocal
          from app.models import Company
          with SessionLocal() as db:
              db.add(Company(name='Backup drill company')); db.commit()
          print('schema created and one company inserted')"

      - name: Take a backup, check the health signal, run the restore drill
        run: |
          docker build -t nuqati-backup:ci ops/backup
          docker volume create nq-backups
          backup_image() {
            docker run --rm --network nq-ci -e PGHOST=nq-db -e PGUSER=ci -e PGPASSWORD=ci-only -e PGDATABASE=ci -v nq-backups:/backups "$@"
          }
          backup_image nuqati-backup:ci once
          backup_image nuqati-backup:ci health
          backup_image --entrypoint /usr/local/bin/restore_drill.sh nuqati-backup:ci | tee drill.txt
          grep -q '^RESULT: OK' drill.txt
          grep -q '^companies ' drill.txt
          left=$(docker exec nq-db psql -U ci -d ci -Atc "SELECT count(*) FROM pg_database WHERE datname='nuqati_restore_drill'")
          test "$left" = "0"   # the restored copy of personal data must not be left behind

      - name: Failure cases
        run: |
          backup_image() {
            docker run --rm --network nq-ci -e PGHOST=nq-db -e PGUSER=ci -e PGDATABASE=ci -v nq-backups:/backups "$@"
          }
          # wrong password: the backup must fail, keep the previous good dump and leave no partial file
          before=$(docker run --rm -v nq-backups:/backups alpine sh -c 'ls -A /backups | sort')
          if backup_image -e PGPASSWORD=wrong nuqati-backup:ci once; then echo "a backup with the wrong password must fail"; exit 1; fi
          after=$(docker run --rm -v nq-backups:/backups alpine sh -c 'ls -A /backups | sort')
          test "$before" = "$after"
          # an empty volume has no backup yet: the health signal must be red
          docker volume create nq-empty
          if docker run --rm -v nq-empty:/backups nuqati-backup:ci health; then echo "health must fail without a backup"; exit 1; fi

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Start a disposable PostgreSQL and build the API image
        run: |
          set -euo pipefail
          docker network create nq-m
          docker run -d --name nq-mdb --network nq-m -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci-only -e POSTGRES_DB=ci postgres:16-alpine
          # the official image starts a temporary server to initialise, stops it, then starts the real one
          for i in $(seq 1 60); do [ "$(docker logs nq-mdb 2>&1 | grep -c 'ready to accept connections')" -ge 2 ] && break; sleep 1; done
          docker exec nq-mdb pg_isready -U ci -d ci
          docker build -f backend/Dockerfile -t nuqati-api:ci .

      - name: A new database built only by migrations
        run: |
          set -euo pipefail
          . ops/ci/migrations_lib.sh
          newdb fresh
          expect_exit 0 "migrate builds a new database" -- api fresh nuqati-api:ci python -m app.migrate
          test "$(version_of fresh)" = "0001"
          tables=$(sql fresh "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name <> 'alembic_version'")
          echo "the migrated database has $tables tables"
          test "$tables" -ge 40
          fingerprint fresh > fresh.txt
          test "$(wc -l < fresh.txt)" -gt 200
          expect_exit 0 "a second run changes nothing" -- api fresh nuqati-api:ci python -m app.migrate
          expect_exit 0 "status is current" -- api fresh nuqati-api:ci python -m app.migrate status
          fingerprint fresh > fresh_again.txt
          diff -u fresh.txt fresh_again.txt

      - name: The application changes nothing in the schema, and its models match the schema
        run: |
          set -euo pipefail
          . ops/ci/migrations_lib.sh
          # importing every module that used to create tables at start-up must not touch the schema any more
          api fresh nuqati-api:ci python -c "from app.main import app; import app.teltonika_receiver, app.report_subscriptions, app.connectivity_alerts; print('application imported')"
          fingerprint fresh > fresh_after_import.txt
          diff -u fresh.txt fresh_after_import.txt
          # every table and column of the ORM models exists (a model change without a revision fails here)
          expect_exit 0 "models match the migrated schema" -- api fresh -e PYTHONPATH=/app -v "$PWD/ops/ci/check_models.py:/tmp/check_models.py:ro" nuqati-api:ci python /tmp/check_models.py

      - name: An existing database (built before Alembic) is adopted without any change
        run: |
          set -euo pipefail
          . ops/ci/migrations_lib.sh
          # what production has: the baseline schema and no alembic_version table
          newdb existing
          docker exec -i "$MDB" psql -U ci -d existing -v ON_ERROR_STOP=1 -q -f - < backend/app/migrations/versions/0001_baseline.sql
          must_not has_version_table existing
          fingerprint existing > before.txt
          diff -u fresh.txt before.txt
          expect_exit 0 "the first run adopts" -- api existing nuqati-api:ci python -m app.migrate
          grep -q "adopted" <<< "$OUT"
          test "$(version_of existing)" = "0001"
          fingerprint existing > after.txt
          diff -u before.txt after.txt
          test "$(sql existing "SELECT count(*) FROM pg_namespace WHERE nspname='nuqati_baseline_check'")" = "0"
          expect_exit 0 "the second run does nothing" -- api existing nuqati-api:ci python -m app.migrate
          must_not grep -q "adopted" <<< "$OUT"
          expect_exit 0 "status is current" -- api existing nuqati-api:ci python -m app.migrate status
          expect_exit 0 "check finds no difference" -- api existing nuqati-api:ci python -m app.migrate check

      - name: A database that lacks something is refused and left alone
        run: |
          set -euo pipefail
          . ops/ci/migrations_lib.sh
          newdb badcol_src
          docker exec -i "$MDB" psql -U ci -d badcol_src -v ON_ERROR_STOP=1 -q -f - < backend/app/migrations/versions/0001_baseline.sql
          copydb badcol_src badcol
          sql badcol "ALTER TABLE companies DROP COLUMN name CASCADE"
          expect_exit 1 "missing column is refused" -- api badcol nuqati-api:ci python -m app.migrate
          grep -q "column companies.name is missing" <<< "$OUT"
          must_not has_version_table badcol
          copydb badcol_src badtable
          sql badtable "DROP TABLE security_audit CASCADE"
          expect_exit 1 "missing table is refused" -- api badtable nuqati-api:ci python -m app.migrate
          grep -q "table security_audit is missing" <<< "$OUT"
          must_not has_version_table badtable
          expect_exit 1 "check reports it too" -- api badtable nuqati-api:ci python -m app.migrate check
          for db in badcol badtable; do
            test "$(sql $db "SELECT count(*) FROM pg_namespace WHERE nspname='nuqati_baseline_check'")" = "0"
          done

      - name: Later revisions - a failing one is rolled back completely, a good one is applied
        run: |
          set -euo pipefail
          . ops/ci/migrations_lib.sh
          mkdir ci_rev
          cat > ci_rev/0002_ci_failing.py <<'PY'
          from alembic import op
          revision = "0002"
          down_revision = "0001"
          branch_labels = None
          depends_on = None
          def upgrade():
              op.execute("CREATE TABLE ci_probe (id integer)")
              op.execute("ALTER TABLE companies ADD COLUMN ci_probe text")
              op.execute("SELECT 1/0")
          def downgrade():
              pass
          PY
          cat > ci_rev/0002_ci_good.py <<'PY'
          from alembic import op
          revision = "0002"
          down_revision = "0001"
          branch_labels = None
          depends_on = None
          def upgrade():
              op.execute("ALTER TABLE companies ADD COLUMN ci_probe text")
          def downgrade():
              pass
          PY
          mount() { echo "-v $PWD/ci_rev/$1:/app/app/migrations/versions/$1:ro"; }
          expect_exit 1 "a failing revision stops the run" -- api fresh $(mount 0002_ci_failing.py) nuqati-api:ci python -m app.migrate
          test "$(version_of fresh)" = "0001"
          test -z "$(sql fresh "SELECT to_regclass('public.ci_probe')")"
          test "$(sql fresh "SELECT count(*) FROM information_schema.columns WHERE table_name='companies' AND column_name='ci_probe'")" = "0"
          echo "ok: nothing of the failed revision remains"
          expect_exit 1 "status shows the database is behind" -- api fresh $(mount 0002_ci_good.py) nuqati-api:ci python -m app.migrate status
          expect_exit 0 "a good revision is applied" -- api fresh $(mount 0002_ci_good.py) nuqati-api:ci python -m app.migrate
          test "$(version_of fresh)" = "0002"
          test "$(sql fresh "SELECT count(*) FROM information_schema.columns WHERE table_name='companies' AND column_name='ci_probe'")" = "1"
          expect_exit 0 "status is current again" -- api fresh $(mount 0002_ci_good.py) nuqati-api:ci python -m app.migrate status
          # a revision created with the helper has the next number and points at the newest revision
          expect_exit 0 "new creates the next revision file" -- api fresh --user root nuqati-api:ci sh -c 'python -m app.migrate new "add a probe column" && cat app/migrations/versions/0002_add_a_probe_column.py'
          grep -q 'revision = .0002.' <<< "$OUT"
          grep -q 'down_revision = .0001.' <<< "$OUT"

      - name: The API container - migrations by default, fail-fast, and the off switch
        run: |
          set -euo pipefail
          . ops/ci/migrations_lib.sh
          # 1. default (variable not set), brand-new database: tables are built by the migration, then the API answers
          newdb service
          start_api nq-svc service
          ready nq-svc || { docker logs nq-svc; exit 1; }
          test "$(version_of service)" = "0001"
          docker logs nq-svc 2>&1 | sed 's/^/    | /' | tail -n 20
          # 2. database that lacks something: the container stops, the API never starts
          start_api nq-bad badtable
          code=$(timeout 120 docker wait nq-bad)
          logs=$(docker logs nq-bad 2>&1)
          printf '%s\n' "$logs" | sed 's/^/    | /'
          test "$code" != "0"
          grep -q "table security_audit is missing" <<< "$logs"
          must_not grep -q "Uvicorn running" <<< "$logs"
          must_not has_version_table badtable
          # 3. NUQATI_RUN_MIGRATIONS=0: nothing is migrated, and the application does not repair the schema by itself
          start_api nq-off badtable 0
          ready nq-off || { docker logs nq-off; exit 1; }
          must_not has_version_table badtable
          test -z "$(sql badtable "SELECT to_regclass('public.security_audit')")"
          echo "ok: with NUQATI_RUN_MIGRATIONS=0 nothing is migrated and the application creates no table"

      - name: Container logs on failure
        if: failure()
        run: |
          for c in nq-svc nq-bad nq-off; do echo "== $c"; docker logs "$c" 2>&1 | tail -40 || true; done

  workers:
    name: Worker health checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Start a disposable PostgreSQL and create the application's schema with migrations
        run: |
          docker network create nq-w
          docker run -d --name nq-wdb --network nq-w -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci-only -e POSTGRES_DB=ci postgres:16-alpine
          # the official image starts a temporary server to initialise, stops it, then starts the real one
          for i in $(seq 1 60); do [ "$(docker logs nq-wdb 2>&1 | grep -c 'ready to accept connections')" -ge 2 ] && break; sleep 1; done
          docker exec nq-wdb pg_isready -U ci -d ci
          docker build -f backend/Dockerfile -t nuqati-api:ci .
          docker run --rm --network nq-w \
            -e DATABASE_URL=postgresql+psycopg2://ci:ci-only@nq-wdb:5432/ci \
            -e NUQATI_AUTH_SECRET=ci-only-secret-at-least-32-characters-long-0000 \
            nuqati-api:ci python -m app.migrate

      - name: Start the real tracker receiver and report scheduler
        run: |
          common="--network nq-w -e DATABASE_URL=postgresql+psycopg2://ci:ci-only@nq-wdb:5432/ci"
          docker run -d --name nq-tel $common -e TELTONIKA_BIND_HOST=127.0.0.1 -e TELTONIKA_PORT=5027 nuqati-api:ci python -m app.teltonika_receiver
          docker run -d --name nq-sched $common nuqati-api:ci python -m app.report_subscriptions
          sleep 20
          docker logs nq-tel 2>&1 | tail -5
          docker logs nq-sched 2>&1 | tail -5
          test "$(docker inspect -f '{{.State.Running}}' nq-tel)" = "true"
          test "$(docker inspect -f '{{.State.Running}}' nq-sched)" = "true"

      - name: Both workers report healthy with the limits compose.yml uses
        run: |
          docker exec nq-tel python -m app.heartbeat teltonika 90
          docker exec nq-sched python -m app.heartbeat report_scheduler 900
          # the healthcheck must work as the unprivileged user the containers run as
          test "$(docker exec nq-tel id -u)" != "0"

      - name: A frozen receiver turns unhealthy, and recovers when it runs again
        run: |
          # the receiver beats every 15 s; use a 40 s limit here so a slow runner cannot cause a false alarm
          docker exec nq-tel python -m app.heartbeat teltonika 40
          docker kill --signal=SIGSTOP nq-tel
          sleep 50
          if docker exec nq-tel python -m app.heartbeat teltonika 40; then echo "a frozen receiver must be reported as unhealthy"; exit 1; fi
          docker kill --signal=SIGCONT nq-tel
          sleep 25
          docker exec nq-tel python -m app.heartbeat teltonika 40

      - name: A worker that was never started has no heartbeat
        run: |
          if docker run --rm nuqati-api:ci python -m app.heartbeat report_scheduler 900; then echo "no heartbeat must mean unhealthy"; exit 1; fi

  loadtest:
    name: Load test (GPS ingestion)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Measures the real API container (one process, as in compose.yml) with a real PostgreSQL 16 and simulated driver phones.
    # A GitHub runner is not your server: the numbers show where this design starts to slow down and whether anything
    # breaks or gets lost, they are not a promise about production. Tools: ops/loadtest/.
    steps:
      - uses: actions/checkout@v4

      - name: Start a disposable PostgreSQL and build the API image
        run: |
          set -euo pipefail
          docker network create nq-l
          docker run -d --name nq-ldb --network nq-l -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci-only -e POSTGRES_DB=ci postgres:16-alpine
          # the official image starts a temporary server to initialise, stops it, then starts the real one
          for i in $(seq 1 60); do [ "$(docker logs nq-ldb 2>&1 | grep -c 'ready to accept connections')" -ge 2 ] && break; sleep 1; done
          docker exec nq-ldb pg_isready -U ci -d ci
          docker build -f backend/Dockerfile -t nuqati-api:ci .

      - name: Start the API as compose does (migrations on, GPS limits enforced) and create 900 simulated drivers
        run: |
          set -euo pipefail
          common="-e DATABASE_URL=postgresql+psycopg2://ci:ci-only@nq-ldb:5432/ci -e NUQATI_AUTH_SECRET=ci-only-secret-at-least-32-characters-long-0000"
          docker run -d --name nq-lapi --network nq-l -p 18000:8000 $common -e NUQATI_RATE_LIMIT_INGEST=enforce nuqati-api:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:18000/api/v1/ready >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:18000/api/v1/ready
          docker run --rm --network nq-l $common -e NUQATI_LOADTEST_DISPOSABLE=1 -e PYTHONPATH=/app \
            -v "$PWD/ops/loadtest/seed.py:/tmp/seed.py:ro" nuqati-api:ci python /tmp/seed.py --drivers 900 > seed.json
          test -s seed.json
          jq '{company_id, drivers: (.drivers | length), admins: (.admin_tokens | length)}' seed.json

      - name: Ramp up simulated phones, then a backlog replay, an abusive client, and exports during ingestion
        run: |
          set -uo pipefail
          . ops/loadtest/lib.sh
          failed=0
          # Every scenario has its own drivers (a trip that already received samples would see the first sample of the next
          # step closer than 0.7 s to its last one, and the API answers such a sample without storing it).
          # 1 request every 2 seconds per driver, like the app. 50, 100, 200, 400 drivers = 25, 50, 100, 200 requests per second.
          measure ramp-50  18 steady --drivers 50  --offset 0   --seconds 30 --gate --p95-ms 1500 || failed=1
          measure ramp-100 18 steady --drivers 100 --offset 50  --seconds 30 --gate || failed=1
          measure ramp-200 18 steady --drivers 200 --offset 150 --seconds 30 || true
          measure ramp-400 18 steady --drivers 400 --offset 350 --seconds 30 || true
          # 20 phones that were offline each send 100 queued points back to back (the app's replay batch)
          measure replay   6  replay --drivers 20 --offset 750 --samples 100 --gate || failed=1
          # one client sends 700 samples as fast as it can while 50 normal phones keep working
          measure abuse    15 abuse --offset 770 --steady-offset 780 --requests 700 --steady 50 --seconds 40 --gate || failed=1
          # 50 normal phones while two administrators keep exporting the monthly report (xlsx, pdf, csv)
          measure mixed    15 mixed --drivers 50 --offset 830 --exporters 2 --seconds 30 --gate || failed=1
          exit "$failed"

      - name: Results, and checks on the whole run
        if: always()
        run: |
          set -uo pipefail
          test -s results.jsonl || { echo "no results were recorded"; exit 1; }
          db_rows=$(docker exec nq-ldb psql -U ci -d ci -Atc "SELECT count(*) FROM driver_locations")
          refused=$(docker logs nq-lapi 2>&1 | grep -c "rate_limit REFUSED" || true)
          tracebacks=$(docker logs nq-lapi 2>&1 | grep -c "Traceback" || true)
          echo "database rows: $db_rows, logged refusals: $refused, tracebacks: $tracebacks"
          set +e
          python3 ops/loadtest/summary.py results.jsonl --db-rows "$db_rows" --refused-logged "$refused" --tracebacks "$tracebacks" > summary.md
          status=$?
          set -e
          cat summary.md
          { echo "### GPS ingestion load test"; echo; cat summary.md; echo; echo "Shared GitHub runner (4 vCPU), one API process, PostgreSQL 16: indicative only."; } >> "$GITHUB_STEP_SUMMARY"
          docker logs nq-lapi 2>&1 | grep "rate_limit" | head -5 || true
          docker logs nq-lapi 2>&1 | tail -5
          exit "$status"

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory until the baseline has been run once: the first run may report pre-existing findings.
    # Delete the next line to make lint blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.8,<1"
      - run: ruff check backend
