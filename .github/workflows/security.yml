name: Security checks

# Advisory only. Every job below may fail without blocking a pull request, a merge or a deploy
# (`continue-on-error`). They report; a person decides. Nothing here deploys or publishes anything.
#
# Runs weekly, on pull requests that touch dependency files, and on demand
# (Actions -> Security checks -> Run workflow). Results are attached to each run as artifacts.

on:
  schedule:
    - cron: "41 3 * * 1" # Mondays, 03:41 UTC
  pull_request:
    paths:
      - "backend/requirements.txt"
      - "backend/requirements-test.txt"
      - "web/package.json"
      - ".github/workflows/security.yml"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-dependencies:
    name: Python dependencies (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # same minor version as backend/Dockerfile

      # The requirements files use version ranges, so what actually gets installed changes over time.
      # This freezes today's resolution; commit it as a lock file when you want reproducible builds.
      - name: Resolve and freeze the backend dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip freeze | sort > backend-requirements.lock.txt
          echo "Resolved $(wc -l < backend-requirements.lock.txt) packages"

      - name: Check the resolved versions for known vulnerabilities
        shell: bash
        run: |
          python -m pip install pip-audit
          python -m pip_audit --requirement backend-requirements.lock.txt --no-deps --disable-pip 2>&1 | tee pip-audit-report.txt

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-dependency-audit
          path: |
            backend-requirements.lock.txt
            pip-audit-report.txt
          if-no-files-found: warn

  web-dependencies:
    name: Web dependencies (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # same major version as web/Dockerfile

      # web/package-lock.json is not committed yet; resolve one without installing or running any package scripts.
      - name: Resolve a lock file if none is committed
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi

      - name: Check for known vulnerabilities (high and critical)
        shell: bash
        run: npm audit --audit-level=high 2>&1 | tee npm-audit-report.txt

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-dependency-audit
          path: |
            web/npm-audit-report.txt
            web/package-lock.json
          if-no-files-found: warn

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      # Results are always saved as a downloadable SARIF file. Showing them under Security -> Code scanning
      # needs a public repository or GitHub Advanced Security, so that upload is allowed to fail.
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: never
          output: codeql-results

      - name: Show results under Security -> Code scanning when the repository allows it
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: codeql-results
          category: "/language:${{ matrix.language }}"

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-${{ matrix.language }}
          path: codeql-results
          if-no-files-found: warn

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the full history, not only the latest commit

      # Pinned image tag. Matches are redacted, so no secret value is printed to the log or the report.
      - name: Scan the repository history for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --no-banner --exit-code 1 \
            --report-format json --report-path /repo/gitleaks-report.json

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan
          path: gitleaks-report.json
          if-no-files-found: ignore
