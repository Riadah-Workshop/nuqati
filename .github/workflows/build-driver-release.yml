
name: Build Nuqati Driver signed AAB (Google Play)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android Flutter project
        run: flutter create --platforms=android --project-name nuqati_driver .

      - name: Use updated driver application
        run: |
          test -s main.dart || (echo 'ERROR: driver_app/main.dart missing' && exit 1)
          mkdir -p lib
          cp main.dart lib/main.dart
          test -s nuqati_network.dart || (echo "ERROR: missing Nuqati VPN failover library" && exit 1)
          cp nuqati_network.dart lib/nuqati_network.dart
          test -s vehicle_handover.dart || (echo 'ERROR: driver_app/vehicle_handover.dart missing; handover cannot compile' && exit 1)
          cp vehicle_handover.dart lib/vehicle_handover.dart
          test -s lib/vehicle_handover.dart || (echo 'ERROR: vehicle handover screen missing from lib/' && exit 1)
          grep -q 'Iqama / Saudi ID number' lib/main.dart || (echo 'ERROR: Iqama login UI missing' && exit 1)
          if grep -q 'Driver email' lib/main.dart; then
            echo 'ERROR: old email login still present'
            exit 1
          fi

      - name: Install camera-activity observer (no video or image access)
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/nuqati_driver
          cp android_camera_activity/MainActivity.kt android/app/src/main/kotlin/com/example/nuqati_driver/MainActivity.kt
          cp android_native_tracking/NuqatiNativeTrackingService.kt android/app/src/main/kotlin/com/example/nuqati_driver/NuqatiNativeTrackingService.kt
          cp android_native_tracking/NuqatiBootReceiver.kt android/app/src/main/kotlin/com/example/nuqati_driver/NuqatiBootReceiver.kt

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permissions = [
              'android.permission.INTERNET',
              'android.permission.ACCESS_NETWORK_STATE',
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.ACCESS_COARSE_LOCATION',
              'android.permission.ACCESS_BACKGROUND_LOCATION',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_LOCATION',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.WAKE_LOCK',
              'android.permission.RECEIVE_BOOT_COMPLETED'
          ]
          for perm in permissions:
              if perm not in s:
                  s = s.replace(
                      '<application',
                      f'<uses-permission android:name="{perm}"/>\n    <application',
                      1
                  )
          # Android 14 requires the foreground service type and matching permission.
          s=s.replace('<application', '<application android:usesCleartextTraffic="false"',1) if 'usesCleartextTraffic' not in s else s
          if 'id.flutter.flutter_background_service.BackgroundService' not in s:
              s=s.replace('</application>', '''<service android:name="id.flutter.flutter_background_service.BackgroundService" android:foregroundServiceType="location" android:exported="false"/>\n    </application>''' ,1)
          if 'NuqatiNativeTrackingService' not in s:
              s=s.replace('</application>', '<service android:name=".NuqatiNativeTrackingService" android:foregroundServiceType="location" android:exported="false"/>\n    </application>',1)
          if 'NuqatiBootReceiver' not in s:
              s=s.replace('</application>', '<receiver android:name=".NuqatiBootReceiver" android:exported="false"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/><action android:name="android.intent.action.MY_PACKAGE_REPLACED"/></intent-filter></receiver>\n    </application>',1)
          p.write_text(s)
          PY

      - name: Provide explicit foreground service notification icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_bg_service_small.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M12,2a10,10 0,1 0,0 20a10,10 0,1 0,0 -20zM12,6a6,6 0,1 1,0 12a6,6 0,1 1,0 -12z"/>
          </vector>
          XML

      - name: Resolve background service manifest conflict
        run: |
          python3 - <<'PYMANIFEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          android = 'http://schemas.android.com/apk/res/android'
          tools = 'http://schemas.android.com/tools'
          ET.register_namespace('android', android)
          ET.register_namespace('tools', tools)
          service_name = 'id.flutter.flutter_background_service.BackgroundService'
          for flavor in ('main', 'debug', 'profile'):
              path = Path(f'android/app/src/{flavor}/AndroidManifest.xml')
              if not path.exists():
                  continue
              root = ET.parse(path).getroot()
              application = root.find('application')
              if application is None:
                  if flavor == 'main':
                      raise RuntimeError('Main Android manifest has no application element')
                  application = ET.SubElement(root, 'application')
              services = [node for node in application.findall('service')
                          if node.get(f'{{{android}}}name') == service_name]
              for duplicate in services[1:]:
                  application.remove(duplicate)
              service = services[0] if services else ET.SubElement(application, 'service')
              service.set(f'{{{android}}}name', service_name)
              service.set(f'{{{android}}}exported', 'false')
              service.set(f'{{{android}}}foregroundServiceType', 'location')
              service.set(f'{{{tools}}}replace', 'android:exported')
              ET.ElementTree(root).write(path, encoding='unicode', xml_declaration=True)
              print(f'Patched {path}: exported=false, tools:replace=android:exported')
          PYMANIFEST

      - name: Enable core library desugaring for notifications
        run: |
          python3 - <<'PYGRADLE'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          if not p.exists():
              raise RuntimeError('Expected generated Kotlin Gradle file: android/app/build.gradle.kts')
          s = p.read_text()
          if 'isCoreLibraryDesugaringEnabled' not in s:
              if 'compileOptions {' not in s:
                  raise RuntimeError('Cannot find compileOptions in generated Gradle file')
              s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:' not in s:
              s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          if 'com.google.android.gms:play-services-location:' not in s:
              s += '\ndependencies {\n    implementation("com.google.android.gms:play-services-location:21.3.0")\n}\n'
          p.write_text(s)
          PYGRADLE

      - name: Verify Android desugaring configuration
        run: |
          echo "=== Gradle desugaring configuration ==="
          grep -n -E 'isCoreLibraryDesugaringEnabled|coreLibraryDesugaring|desugar_jdk_libs|play-services-location' android/app/build.gradle.kts
          python3 - <<'PYVERIFY'
          from pathlib import Path
          s = Path('android/app/build.gradle.kts').read_text()
          assert 'isCoreLibraryDesugaringEnabled = true' in s, 'Desugaring is not enabled'
          assert 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:' in s, 'Desugaring dependency missing'
          assert 'implementation("com.google.android.gms:play-services-location:21.3.0")' in s, 'Fused location dependency missing'
          print('VERIFIED: Android desugaring and fused location dependency are configured')
          PYVERIFY

      - name: Install dependencies
        run: flutter pub get

      # Catch Flutter/Dart syntax and type errors before the costly Android/iOS build.
      - name: Analyze Driver API and app Dart source
        run: |
          test -s lib/nuqati_network.dart && test -s lib/main.dart
          dart format --output=none lib/nuqati_network.dart
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib/main.dart lib/nuqati_network.dart

      - name: Analyze vehicle handover Dart source
        run: |
          test -s lib/vehicle_handover.dart || (echo 'Missing handover screen in lib/' && exit 1)
          dart format --output=none lib/vehicle_handover.dart
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib/vehicle_handover.dart

      - name: Generate Nuqati launcher icon
        run: |
          test -s assets/nuqati_icon.png || (echo 'ERROR: driver_app/assets/nuqati_icon.png missing. Apply the Nuqati icon patch first.' && exit 1)
          grep -q 'flutter_launcher_icons:' pubspec.yaml || (echo 'ERROR: flutter_launcher_icons configuration missing in driver_app/pubspec.yaml' && exit 1)
          # Generate Android icons only: this workflow does not create an iOS project.
          cat > flutter_launcher_icons_android.yaml <<'ICONCONFIG'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: assets/nuqati_icon.png
          ICONCONFIG
          dart run flutter_launcher_icons -f flutter_launcher_icons_android.yaml
          test -s android/app/src/main/res/mipmap-hdpi/ic_launcher.png || (echo 'ERROR: Android launcher icon generation failed' && exit 1)
          echo 'Nuqati launcher icons generated successfully.'

      - name: Remove generated example test
        run: rm -f test/widget_test.dart

      - name: Validate Play release settings
        env:
          DRIVER_APPLICATION_ID: ${{ vars.DRIVER_APPLICATION_ID }}
          NUQATI_PRODUCTION_API: ${{ vars.NUQATI_PRODUCTION_API }}
          NUQATI_FALLBACK_API: ${{ vars.NUQATI_FALLBACK_API }}
        run: |
          python3 - <<'PYVALIDATE'
          import os, re
          package = os.environ.get('DRIVER_APPLICATION_ID', '').strip()
          api = os.environ.get('NUQATI_PRODUCTION_API', '').strip()
          if not re.fullmatch(r'[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+', package):
              raise SystemExit('Set repository variable DRIVER_APPLICATION_ID to the exact Google Play package name')
          if not api.startswith('https://'):
              raise SystemExit('Set NUQATI_PRODUCTION_API to a verified HTTPS API URL')
          backup = os.environ.get('NUQATI_FALLBACK_API', '').strip()
          if backup:
              from urllib.parse import urlparse
              primary, candidate = urlparse(api), urlparse(backup)
              if (candidate.scheme != 'https' or candidate.hostname == primary.hostname or
                  not candidate.hostname or not (candidate.hostname == 'al-riadah.sa' or candidate.hostname.endswith('.al-riadah.sa')) or
                  candidate.username or candidate.password or candidate.query or candidate.fragment or candidate.path not in ('', '/')):
                  raise SystemExit('NUQATI_FALLBACK_API must be a distinct verified al-riadah.sa HTTPS host without a path')
          print('Release settings validated. Package:', package)
          PYVALIDATE

      - name: Configure Android package, SDK and release signing
        env:
          DRIVER_APPLICATION_ID: ${{ vars.DRIVER_APPLICATION_ID }}
        run: |
          python3 - <<'PYPATCH'
          from pathlib import Path
          import os, re
          path = Path('android/app/build.gradle.kts')
          s = path.read_text()
          app_id = os.environ['DRIVER_APPLICATION_ID']
          s, n = re.subn(r'applicationId\s*=\s*"[^"]+"', f'applicationId = "{app_id}"', s, count=1)
          assert n == 1, 'Cannot locate generated applicationId'
          s, n = re.subn(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 36', s, count=1)
          assert n == 1, 'Cannot locate compileSdk'
          s, n = re.subn(r'targetSdk\s*=\s*[^\n]+', 'targetSdk = 36', s, count=1)
          assert n == 1, 'Cannot locate targetSdk'
          signing = """    signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("DRIVER_KEYSTORE_PATH"))
                      storePassword = System.getenv("DRIVER_STORE_PASSWORD")
                      keyAlias = System.getenv("DRIVER_KEY_ALIAS")
                      keyPassword = System.getenv("DRIVER_KEY_PASSWORD")
                  }
              }
          """
          assert 'signingConfigs.getByName("debug")' in s, 'Generated release signing configuration changed; inspect Gradle file'
          assert '    buildTypes {' in s, 'Cannot locate buildTypes'
          s = s.replace('    buildTypes {', signing + '    buildTypes {', 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")', 1)
          path.write_text(s)
          print('Configured package ID, SDK 36 and release signing (credentials not printed).')
          PYPATCH

      - name: Restore upload keystore
        env:
          DRIVER_KEYSTORE_BASE64: ${{ secrets.DRIVER_KEYSTORE_BASE64 }}
          DRIVER_STORE_PASSWORD: ${{ secrets.DRIVER_STORE_PASSWORD }}
          DRIVER_KEY_PASSWORD: ${{ secrets.DRIVER_KEY_PASSWORD }}
          DRIVER_KEY_ALIAS: ${{ secrets.DRIVER_KEY_ALIAS }}
        run: |
          test -n "$DRIVER_KEYSTORE_BASE64" && test -n "$DRIVER_STORE_PASSWORD" && test -n "$DRIVER_KEY_PASSWORD" && test -n "$DRIVER_KEY_ALIAS" || (echo 'Missing signing secret' && exit 1)
          printf '%s' "$DRIVER_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nuqati-driver-upload.jks"
          chmod 600 "$RUNNER_TEMP/nuqati-driver-upload.jks"
          keytool -list -keystore "$RUNNER_TEMP/nuqati-driver-upload.jks" -alias "$DRIVER_KEY_ALIAS" -storepass "$DRIVER_STORE_PASSWORD" > /dev/null

      - name: Build signed Google Play AAB
        env:
          NUQATI_PRODUCTION_API: ${{ vars.NUQATI_PRODUCTION_API }}
          NUQATI_FALLBACK_API: ${{ vars.NUQATI_FALLBACK_API }}
          DRIVER_KEYSTORE_PATH: ${{ runner.temp }}/nuqati-driver-upload.jks
          DRIVER_STORE_PASSWORD: ${{ secrets.DRIVER_STORE_PASSWORD }}
          DRIVER_KEY_PASSWORD: ${{ secrets.DRIVER_KEY_PASSWORD }}
          DRIVER_KEY_ALIAS: ${{ secrets.DRIVER_KEY_ALIAS }}
        run: flutter build appbundle --release --build-name=1.0.0 --build-number=${{ github.run_number }} --dart-define=NUQATI_API="$NUQATI_PRODUCTION_API" --dart-define=NUQATI_FALLBACK_API="$NUQATI_FALLBACK_API"

      - name: Publish signed AAB to draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -s "$AAB" || { echo "Signed AAB not found: $AAB"; exit 1; }
          TAG="nuqati-driver-aab-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" "$AAB#Nuqati-Driver-${GITHUB_RUN_NUMBER}.aab" \
            --title "Nuqati Driver Google Play AAB - Run ${GITHUB_RUN_NUMBER}" \
            --notes "Signed Nuqati Driver AAB for Google Play. Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Verify package, signing certificate and version before uploading." \
            --target "$GITHUB_SHA" \
            --draft
          echo "Draft release created: ${TAG}"
          echo "Open GitHub > Releases > Drafts to download the signed AAB."

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/nuqati-driver-upload.jks"
