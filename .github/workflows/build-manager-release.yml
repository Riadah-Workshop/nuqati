name: Build Nuqati Manager signed AAB (Google Play)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Do not install default SDK packages during setup: their license prompts
      # can fail non-interactive GitHub Actions jobs.
      - name: Configure Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Accept licenses and install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          test -f "${ANDROID_HOME}/platforms/android-36/android.jar"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create isolated Manager Android project
        run: flutter create --platforms=android --project-name nuqati_manager --org sa.alriadah .

      - name: Install Nuqati Manager source
        run: |
          test -s main.dart
          test -s assets/nuqati_icon.png
          mkdir -p lib
          cp main.dart lib/main.dart

      - name: Configure permissions and release Android identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          for perm in ('android.permission.INTERNET', 'android.permission.POST_NOTIFICATIONS'):
              if perm not in s:
                  s = s.replace('<application', f'<uses-permission android:name="{perm}" />\n    <application', 1)
          manifest.write_text(s)

          gradle = Path('android/app/build.gradle.kts')
          if not gradle.exists():
              raise RuntimeError('Expected Flutter Kotlin Gradle file android/app/build.gradle.kts')
          g = gradle.read_text()
          g, n = re.subn(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "sa.alriadah.nuqati.manager"', g, count=1)
          if n != 1:
              raise RuntimeError('Could not configure Manager applicationId')
          g, n = re.subn(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 36', g, count=1)
          if n != 1:
              raise RuntimeError('Could not configure compileSdk')
          g, n = re.subn(r'targetSdk\s*=\s*[^\n]+', 'targetSdk = 36', g, count=1)
          if n != 1:
              raise RuntimeError('Could not configure targetSdk')
          if 'isCoreLibraryDesugaringEnabled' not in g:
              g = g.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:' not in g:
              g += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          # Generated Flutter Gradle has buildTypes.release signing with the debug key.
          # Replace it with a release signing configuration loaded only from CI environment.
          signing = '''    signingConfigs {
                  create("nuqatiRelease") {
                      storeFile = file(System.getenv("MANAGER_KEYSTORE_PATH") ?: error("Missing MANAGER_KEYSTORE_PATH"))
                      storePassword = System.getenv("MANAGER_STORE_PASSWORD") ?: error("Missing MANAGER_STORE_PASSWORD")
                      keyAlias = System.getenv("MANAGER_KEY_ALIAS") ?: error("Missing MANAGER_KEY_ALIAS")
                      keyPassword = System.getenv("MANAGER_KEY_PASSWORD") ?: error("Missing MANAGER_KEY_PASSWORD")
                  }
              }
          '''
          if 'buildTypes {' not in g:
              raise RuntimeError('Generated Gradle file has no buildTypes')
          g = g.replace('buildTypes {', signing + 'buildTypes {', 1)
          g, n = re.subn(r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)', 'signingConfig = signingConfigs.getByName("nuqatiRelease")', g, count=1)
          if n != 1:
              raise RuntimeError('Could not replace generated debug signing configuration')
          gradle.write_text(g)
          print('Configured Manager package, API 36, desugaring and release signing')
          PY

      - name: Install dependencies
        run: flutter pub get
      - name: Generate Android launcher icon
        run: dart run flutter_launcher_icons
      - name: Remove generated example test and set lint rules
        run: |
          rm -f test/widget_test.dart
          printf 'analyzer:\n  errors:\n    deprecated_member_use: ignore\n' > analysis_options.yaml
      - name: Analyze Dart application
        run: flutter analyze --no-fatal-infos

      - name: Restore Manager signing keystore
        env:
          MANAGER_KEYSTORE_BASE64: ${{ secrets.MANAGER_KEYSTORE_BASE64 }}
          MANAGER_STORE_PASSWORD: ${{ secrets.MANAGER_STORE_PASSWORD }}
          MANAGER_KEY_PASSWORD: ${{ secrets.MANAGER_KEY_PASSWORD }}
          MANAGER_KEY_ALIAS: ${{ secrets.MANAGER_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for v in MANAGER_KEYSTORE_BASE64 MANAGER_STORE_PASSWORD MANAGER_KEY_PASSWORD MANAGER_KEY_ALIAS; do
            if [ -z "${!v:-}" ]; then echo "Missing secret: $v"; exit 1; fi
          done
          printf '%s' "$MANAGER_KEYSTORE_BASE64" | base64 --decode > android/app/nuqati-manager-upload.jks
          keytool -list -keystore android/app/nuqati-manager-upload.jks -storepass "$MANAGER_STORE_PASSWORD" -alias "$MANAGER_KEY_ALIAS" > /dev/null
          chmod 600 android/app/nuqati-manager-upload.jks

      - name: Build signed Manager AAB
        env:
          MANAGER_KEYSTORE_PATH: nuqati-manager-upload.jks
          MANAGER_STORE_PASSWORD: ${{ secrets.MANAGER_STORE_PASSWORD }}
          MANAGER_KEY_PASSWORD: ${{ secrets.MANAGER_KEY_PASSWORD }}
          MANAGER_KEY_ALIAS: ${{ secrets.MANAGER_KEY_ALIAS }}
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MAPTILER_API_KEY:-}" ]; then echo 'Missing MAPTILER_API_KEY secret'; exit 1; fi
          flutter build appbundle --release --build-name=1.0.0 --build-number=1 \
            --dart-define=NUQATI_API=https://staging-nuqati.al-riadah.sa \
            --dart-define=MAPTILER_API_KEY="$MAPTILER_API_KEY"
          test -s build/app/outputs/bundle/release/app-release.aab

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f android/app/nuqati-manager-upload.jks

      - name: Upload signed Manager AAB
        uses: actions/upload-artifact@v4
        with:
          name: nuqati-manager-google-play-aab
          path: manager/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
