name: Build Nuqati iOS Simulator
on:
  workflow_dispatch:
jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS project
        run: flutter create --platforms=ios --project-name nuqati_driver .
      - name: Set iOS location usage description
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ios/Runner/Info.plist')
          s = p.read_text()
          if '<key>NSLocationWhenInUseUsageDescription</key>' not in s:
              s = s.replace('</dict>', '<key>NSLocationWhenInUseUsageDescription</key>\n<string>Nuqati uses your location during an active trip to record driving distance and events.</string>\n</dict>', 1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Remove generated sample test
        run: rm -f test/widget_test.dart
      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos
      - name: Build iOS simulator app
        run: flutter build ios --simulator --debug --dart-define=NUQATI_API=https://staging-nuqati.al-riadah.sa
      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app nuqati-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: nuqati-ios-simulator-iqama-pilot
          path: mobile/nuqati-ios-simulator.zip
          retention-days: 7
