name: Build Nuqati iOS (simulator and unsigned device)

# Builds the driver or manager app for iOS without signing: a simulator app and an unsigned device app (NOT an installable IPA).
# For a signed build that goes to TestFlight use "Release Nuqati iOS to TestFlight" (release-ios.yml), which needs your Apple account.
# The project is generated and prepared by .github/actions/ios-project, the same code the pull-request check (ci-ios.yml) runs.

on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app to build
        type: choice
        options:
          - driver
          - manager
        default: driver

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      APP: ${{ inputs.app }}
    defaults:
      run:
        working-directory: ${{ inputs.app }}_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate and prepare the iOS project
        uses: ./.github/actions/ios-project
        with:
          app: ${{ inputs.app }}

      - name: Analyze Flutter code
        # Dart errors fail the job; warnings and infos are reported only (as in the Android workflows).
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Build iOS simulator app
        run: flutter build ios --simulator --debug --dart-define=NUQATI_API=https://nuqati.al-riadah.sa

      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app "nuqati-${APP}-ios-simulator.zip"

      - name: Build unsigned physical-device app (not an installable IPA)
        run: flutter build ios --release --no-codesign --dart-define=NUQATI_API=https://nuqati.al-riadah.sa

      - name: Package unsigned device app for Xcode signing
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app "nuqati-${APP}-ios-unsigned-device.zip"

      # Store the unsigned iOS builds as a private draft GitHub Release.
      # Release assets do not use the GitHub Actions artifact quota.
      - name: Save iOS builds to draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s "nuqati-${APP}-ios-simulator.zip"
          test -s "nuqati-${APP}-ios-unsigned-device.zip"
          tag="nuqati-${APP}-ios-internal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" \
            "nuqati-${APP}-ios-simulator.zip" \
            "nuqati-${APP}-ios-unsigned-device.zip" \
            --title "Nuqati ${APP} iOS unsigned builds - Run ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes "Internal unsigned iOS builds from commit ${GITHUB_SHA}. Simulator build and unsigned device app; NOT a signed installable IPA." \
            --target "$GITHUB_SHA" \
            --draft \
            --prerelease
          echo "Open GitHub > Releases > Drafts to download the two ZIP files."
