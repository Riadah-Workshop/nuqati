name: Build Nuqati iOS Simulator
on:
  workflow_dispatch:
jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS project
        run: flutter create --platforms=ios --project-name nuqati_driver .
      - name: Install Nuqati driver source and online handover screen
        run: |
          test -s main.dart
          test -s vehicle_handover.dart
          mkdir -p lib
          cp main.dart lib/main.dart
          cp vehicle_handover.dart lib/vehicle_handover.dart

      - name: Set iOS location usage description
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ios/Runner/Info.plist')
          s = p.read_text()
          if '<key>NSLocationWhenInUseUsageDescription</key>' not in s:
              s = s.replace('</dict>', '<key>NSLocationWhenInUseUsageDescription</key>\n<string>Nuqati uses your location during an active trip to record driving distance and events.</string>\n</dict>', 1)
          if '<key>NSCameraUsageDescription</key>' not in s:
              s = s.replace('</dict>', '<key>NSCameraUsageDescription</key>\n<string>Nuqati captures vehicle inspection evidence only during online handovers.</string>\n</dict>', 1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: flutter pub get

      # Catch Flutter/Dart syntax and type errors before the costly Android/iOS build.
      - name: Analyze vehicle handover Dart source
        run: |
          test -s lib/vehicle_handover.dart || (echo 'Missing handover screen in lib/' && exit 1)
          dart format --output=none lib/vehicle_handover.dart
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib/vehicle_handover.dart
      - name: Remove generated sample test
        run: rm -f test/widget_test.dart
      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos
      - name: Build iOS simulator app
        run: flutter build ios --simulator --debug --dart-define=NUQATI_API=https://nuqati.al-riadah.sa
      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app nuqati-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: nuqati-ios-simulator-iqama-pilot
          path: mobile/nuqati-ios-simulator.zip
          retention-days: 7
