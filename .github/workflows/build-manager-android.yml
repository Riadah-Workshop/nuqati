name: Build Nuqati Manager Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'manager/**'
      - '.github/workflows/build-manager-android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create isolated manager Android project
        run: flutter create --platforms=android --project-name nuqati_manager --org sa.alriadah .
      - name: Install Nuqati Manager source
        run: |
          test -s main.dart
          test -s assets/nuqati_icon.png
          mkdir -p lib
          cp main.dart lib/main.dart
      - name: Set Android Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          text=p.read_text()
          permission='<uses-permission android:name="android.permission.INTERNET" />'
          if 'android.permission.INTERNET' not in text:
              text=text.replace('<application',permission+'\n    <application',1)
          p.write_text(text)
          PY
      - name: Enable notification permissions and Java desugaring
        run: |
          python3 - <<'PYANDROID'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml');s=p.read_text()
          if 'android.permission.POST_NOTIFICATIONS' not in s:
              s=s.replace('<application','<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application',1)
          p.write_text(s)
          for name in ('android/app/build.gradle.kts','android/app/build.gradle'):
              p=Path(name)
              if not p.exists():continue
              t=p.read_text()
              if name.endswith('.kts'):
                  t=t.replace('compileOptions {','compileOptions {\n        isCoreLibraryDesugaringEnabled = true',1)
                  t=t.replace('dependencies {','dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',1) if 'dependencies {' in t else t+'\ndependencies { coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4") }\n'
              else:
                  t=t.replace('compileOptions {','compileOptions {\n        coreLibraryDesugaringEnabled true',1)
                  t=t.replace('dependencies {','dependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"',1) if 'dependencies {' in t else t+'\ndependencies { coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4" }\n'
              p.write_text(t)
          PYANDROID
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Android-only launcher icon
        run: dart run flutter_launcher_icons
      - name: Remove generated example test and invalid lint reference
        run: |
          rm -f test/widget_test.dart
          printf 'analyzer:\n  errors:\n    deprecated_member_use: ignore\n' > analysis_options.yaml
      - name: Analyze Dart application
        run: flutter analyze --no-fatal-infos
      - name: Build Nuqati Manager APK
        env:
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
        run: |
          flutter build apk --debug \
            --dart-define=NUQATI_API=https://nuqati.al-riadah.sa \
            --dart-define=MAPTILER_API_KEY="$MAPTILER_API_KEY"
      - name: Upload Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: nuqati-manager-debug-apk
          path: manager/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
