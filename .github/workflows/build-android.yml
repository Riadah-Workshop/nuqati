
name: Build Nuqati Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name nuqati_driver .

      - name: Configure Android location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = "<application"
          permissions = (
              '<uses-permission android:name="android.permission.INTERNET" />\n'
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
          )
          if 'android.permission.ACCESS_FINE_LOCATION' not in s:
              s = s.replace(marker, permissions + "    " + marker, 1)
          p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get
        
      - name: Remove generated sample test
        run: rm -f test/widget_test.dart
        
      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos

      - name: Build test APK
        run: |
          flutter build apk --debug \
            --dart-define=NUQATI_API=https://staging-nuqati.al-riadah.sa

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nuqati-android-pilot
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
