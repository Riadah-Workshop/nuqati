name: iOS probe (temporary, never merged)
on:
  push:
    branches: [tmp/ios-probe]
permissions:
  contents: read
jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Driver project file
        working-directory: driver_app
        run: |
          flutter create --platforms=ios --project-name nuqati_driver . >/dev/null
          echo "=====PBXPROJ"; cat ios/Runner.xcodeproj/project.pbxproj
          echo "=====PODFILE-TAIL"; sed -n '/post_install/,$p' ios/Podfile
          echo "=====RUNNERTESTS"; cat ios/RunnerTests/RunnerTests.swift | head -20
          echo "=====ASSETS"; cat ios/Runner/Assets.xcassets/AppIcon.appiconset/Contents.json | head -30
